<VirtualHost *:443>
    ServerName ${VHOST_SERVER_NAME}
    DocumentRoot "/usr/local/apache2/htdocs/proarc"

    <IfModule mod_proxy.c>
      ProxyPass /api http://proarc:8080/proarc timeout=600
      ProxyPassReverse /api http://proarc:8080/proarc
      ProxyPassReverseCookiePath /proarc /api
    </IfModule>

    <Directory "/usr/local/apache2/htdocs/proarc">
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/${VHOST_SSL_CERT_FILE}
    SSLCertificateKeyFile /etc/ssl/private/${VHOST_SSL_CERT_KEY_FILE}
</VirtualHost>
